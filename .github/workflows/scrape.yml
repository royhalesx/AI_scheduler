name: Nightly scrape

on:
  schedule:
    - cron: "0 9 * * *"  # 3am MT (UTC-6)
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape BYU course schedule
        run: python scraper/scrape_courses.py

      - name: Scrape RateMyProfessors
        run: python scraper/scrape_rmp.py

      - name: Merge data
        # --term must match the current active yearterm
        # Update this when the term rolls over (e.g. 20263 → 20265)
        run: python scraper/merge_data.py --term 20265

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/courses.json backend/data/rmp.json
          git diff --cached --quiet || git commit -m "chore: nightly course data update"
          git push
