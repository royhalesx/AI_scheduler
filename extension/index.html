<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="images/BYU monogram_white@2x.png" alt="BYU Logo" class="logo">
      <h1>AI Scheduler</h1>
    </header>
    
    <main class="content">
      <p class="subtitle">Personalized Scheduling Assistant</p>
      
      <div class="action-section">
        <h3>Current Status</h3>
        <ul id="options-list">
          <li class="status-item"><span  id="byuConnection" class="dot gray"></span> Connected to BYU Portal</li>
          <li class="status-item"><span id="hasSavedSchedule" class="dot gray"></span> Schedule Imported</li>
        </ul>
      </div>

      <button id="download-button" class="primary-btn">Download Schedule</button>
       <button id="apply-button" class="secondary-btn">Apply Schedule</button>
    </main>
    
    <script src="scripts/popup.js"></script>
  </div>
</body>
</html>
